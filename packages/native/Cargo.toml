[package]
name = "jogstick-native"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The Node addon (napi). Off for the probe/harness binaries so they don't need Node symbols.
addon = ["dep:napi", "dep:napi-derive"]
harness = ["dep:winit"]

[[bin]]
name = "jogstick-probe"
path = "src/bin/jogstick-probe.rs"

[[bin]]
name = "jogstick-harness"
path = "src/bin/jogstick-harness.rs"
required-features = ["harness"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
napi = { version = "3.15.0", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "3.6.13", optional = true }
winit = { version = "0.30.13", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", features = ["highsierra"] }
core-foundation = "0.10.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
